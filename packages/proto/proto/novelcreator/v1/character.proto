syntax = "proto3";

package novelcreator.v1;

message Character {
  string id = 1;
  string novel_id = 2;
  string category = 3;
  string name = 4;
  optional string description = 5;
  repeated string traits = 6;
  string relationships_json = 7;
  optional string created_at = 8;
  optional string updated_at = 9;
}

message ListCharactersRequest {
  string novel_id = 1;
}

message ListCharactersResponse {
  repeated Character characters = 1;
}

message GetCharacterRequest {
  string id = 1;
}

message CreateCharacterRequest {
  string novel_id = 1;
  string category = 2;
  string name = 3;
  optional string description = 4;
  repeated string traits = 5;
  string relationships_json = 6;
}

message UpdateCharacterRequest {
  string id = 1;
  optional string category = 2;
  optional string name = 3;
  optional string description = 4;
  repeated string traits = 5;
  optional string relationships_json = 6;
}

message DeleteCharacterRequest {
  string id = 1;
}

message DeleteCharacterResponse {
  bool success = 1;
}

message EditCharacterInstructionRequest {
  string id = 1;
  string instruction = 2;
}

message GetCharactersMarkdownRequest {
  string novel_id = 1;
}

message GetCharactersMarkdownResponse {
  string markdown = 1;
}

message SaveCharactersMarkdownRequest {
  string novel_id = 1;
  string markdown = 2;
}

message SaveCharactersMarkdownResponse {
  repeated Character characters = 1;
  int32 created_count = 2;
  int32 updated_count = 3;
  int32 deleted_count = 4;
}

message EditCharacterSectionRequest {
  string novel_id = 1;
  string category = 2;
  string name = 3;
  string description = 4;
  repeated string traits = 5;
  string relationships = 6;
  string instruction = 7;
}

message EditCharacterDocumentRequest {
  string novel_id = 1;
  string markdown = 2;
  string instruction = 3;
}

message EditCharacterResultResponse {
  repeated Character updated_characters = 1;
  optional string parsed_summary = 2;
}

service CharacterService {
  rpc ListCharacters(ListCharactersRequest) returns (ListCharactersResponse);
  rpc GetCharacter(GetCharacterRequest) returns (Character);
  rpc CreateCharacter(CreateCharacterRequest) returns (Character);
  rpc UpdateCharacter(UpdateCharacterRequest) returns (Character);
  rpc DeleteCharacter(DeleteCharacterRequest) returns (DeleteCharacterResponse);
  rpc EditCharacter(EditCharacterInstructionRequest) returns (Character);
  rpc GetCharactersMarkdown(GetCharactersMarkdownRequest) returns (GetCharactersMarkdownResponse);
  rpc SaveCharactersMarkdown(SaveCharactersMarkdownRequest) returns (SaveCharactersMarkdownResponse);
  rpc EditCharacterSection(EditCharacterSectionRequest) returns (EditCharacterResultResponse);
  rpc EditCharacterDocument(EditCharacterDocumentRequest) returns (EditCharacterResultResponse);
}
