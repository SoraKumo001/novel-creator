syntax = "proto3";

package novelcreator.v1;

message ExportNovelRequest {
  string novel_id = 1;
}

message ExportNovelResponse {
  string json_data = 1;
}

message ImportNovelRequest {
  string json_data = 1;
}

message ImportNovelResponse {
  bool success = 1;
  string novel_id = 2;
}

service BackupService {
  rpc ExportNovel(ExportNovelRequest) returns (ExportNovelResponse);
  rpc ImportNovel(ImportNovelRequest) returns (ImportNovelResponse);
}
