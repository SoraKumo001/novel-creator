syntax = "proto3";

package novelcreator.v1;

message Setting {
  string id = 1;
  string novel_id = 2;
  string category = 3;
  string name = 4;
  optional string description = 5;
  string metadata_json = 6;
  optional string created_at = 7;
  optional string updated_at = 8;
}

message ListSettingsRequest {
  string novel_id = 1;
  optional string category = 2;
}

message ListSettingsResponse {
  repeated Setting settings = 1;
}

message GetSettingRequest {
  string id = 1;
}

message CreateSettingRequest {
  string novel_id = 1;
  string category = 2;
  string name = 3;
  optional string description = 4;
  string metadata_json = 5;
}

message UpdateSettingRequest {
  string id = 1;
  optional string category = 2;
  optional string name = 3;
  optional string description = 4;
  optional string metadata_json = 5;
}

message DeleteSettingRequest {
  string id = 1;
}

message DeleteSettingResponse {
  bool success = 1;
}

message EditSettingInstructionRequest {
  string id = 1;
  string instruction = 2;
}

message GenerateSettingDraftRequest {
  string novel_id = 1;
  string category = 2;
  string query = 3;
}

message SettingDraft {
  string name = 1;
  string description = 2;
  string category = 3;
  string metadata_json = 4;
}

message GetSettingsMarkdownRequest {
  string novel_id = 1;
}

message GetSettingsMarkdownResponse {
  string markdown = 1;
}

message SaveSettingsMarkdownRequest {
  string novel_id = 1;
  string markdown = 2;
}

message SaveSettingsMarkdownResponse {
  repeated Setting settings = 1;
  int32 created_count = 2;
  int32 updated_count = 3;
  int32 deleted_count = 4;
}

message EditSettingSectionRequest {
  string novel_id = 1;
  string category = 2;
  string name = 3;
  string description = 4;
  string instruction = 5;
}

message EditSettingDocumentRequest {
  string novel_id = 1;
  string markdown = 2;
  string instruction = 3;
}

message EditSettingResultResponse {
  repeated Setting updated_settings = 1;
  optional string parsed_summary = 2;
}

service SettingService {
  rpc ListSettings(ListSettingsRequest) returns (ListSettingsResponse);
  rpc GetSetting(GetSettingRequest) returns (Setting);
  rpc CreateSetting(CreateSettingRequest) returns (Setting);
  rpc UpdateSetting(UpdateSettingRequest) returns (Setting);
  rpc DeleteSetting(DeleteSettingRequest) returns (DeleteSettingResponse);
  rpc EditSetting(EditSettingInstructionRequest) returns (Setting);
  rpc GenerateDraft(GenerateSettingDraftRequest) returns (SettingDraft);
  rpc GetSettingsMarkdown(GetSettingsMarkdownRequest) returns (GetSettingsMarkdownResponse);
  rpc SaveSettingsMarkdown(SaveSettingsMarkdownRequest) returns (SaveSettingsMarkdownResponse);
  rpc EditSettingSection(EditSettingSectionRequest) returns (EditSettingResultResponse);
  rpc EditSettingDocument(EditSettingDocumentRequest) returns (EditSettingResultResponse);
}
