syntax = "proto3";

package novelcreator.v1;

message HistoryItem {
  string id = 1;
  string novel_id = 2;
  string entity_type = 3;
  string entity_id = 4;
  string title = 5;
  string content = 6;
  string description = 7;
  optional int32 word_count = 8;
  string created_at = 9;
}

message ListHistoriesRequest {
  string novel_id = 1;
  optional string entity_type = 2;
  optional string entity_id = 3;
  optional int32 limit = 4;
}

message ListHistoriesResponse {
  repeated HistoryItem histories = 1;
}

message GetHistoryRequest {
  string id = 1;
}

message RestoreHistoryRequest {
  string id = 1;
}

message RestoreHistoryResponse {
  bool success = 1;
  string message = 2;
}

service HistoryService {
  rpc ListHistories(ListHistoriesRequest) returns (ListHistoriesResponse);
  rpc GetHistory(GetHistoryRequest) returns (HistoryItem);
  rpc RestoreHistory(RestoreHistoryRequest) returns (RestoreHistoryResponse);
}
