syntax = "proto3";

package novelcreator.v1;

message ChatMessage {
  string id = 1;
  string session_id = 2;
  string role = 3;
  string content = 4;
  optional string created_at = 5;
}

message ChatSession {
  string id = 1;
  optional string novel_id = 2;
  string title = 3;
  optional string created_at = 4;
  optional string updated_at = 5;
}

message ChatSessionDetail {
  ChatSession session = 1;
  repeated ChatMessage messages = 2;
}

message ListChatSessionsRequest {
  optional string novel_id = 1;
}

message ListChatSessionsResponse {
  repeated ChatSession sessions = 1;
}

message GetChatSessionRequest {
  string id = 1;
}

message CreateChatMessageInput {
  string role = 1;
  string content = 2;
}

message CreateChatSessionRequest {
  optional string novel_id = 1;
  string title = 2;
  repeated CreateChatMessageInput messages = 3;
}

message UpdateChatSessionRequest {
  string id = 1;
  optional string title = 2;
  repeated CreateChatMessageInput messages = 3;
}

message DeleteChatSessionRequest {
  string id = 1;
}

message DeleteChatSessionResponse {
  bool success = 1;
}

message ExtractChatEntitiesRequest {
  string text = 1;
}

message ExtractedChatCharacter {
  string name = 1;
  string category = 2;
  string description = 3;
  repeated string traits = 4;
}

message ExtractedChatSetting {
  string name = 1;
  string category = 2;
  string description = 3;
}

message ExtractChatEntitiesResponse {
  repeated ExtractedChatCharacter characters = 1;
  repeated ExtractedChatSetting settings = 2;
}

service ChatService {
  rpc ListChatSessions(ListChatSessionsRequest) returns (ListChatSessionsResponse);
  rpc GetChatSession(GetChatSessionRequest) returns (ChatSessionDetail);
  rpc CreateChatSession(CreateChatSessionRequest) returns (ChatSession);
  rpc UpdateChatSession(UpdateChatSessionRequest) returns (ChatSession);
  rpc DeleteChatSession(DeleteChatSessionRequest) returns (DeleteChatSessionResponse);
  rpc ExtractEntities(ExtractChatEntitiesRequest) returns (ExtractChatEntitiesResponse);
}
