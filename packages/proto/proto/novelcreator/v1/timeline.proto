syntax = "proto3";

package novelcreator.v1;

message Timeline {
  string id = 1;
  string novel_id = 2;
  optional string section_id = 3;
  string event = 4;
  int32 order = 5;
  optional string timestamp = 6;
  optional string created_at = 7;
}

message ListTimelinesRequest {
  string novel_id = 1;
}

message ListTimelinesResponse {
  repeated Timeline timelines = 1;
}

message CreateTimelineRequest {
  string novel_id = 1;
  optional string section_id = 2;
  string event = 3;
  int32 order = 4;
  optional string timestamp = 5;
}

message DeleteTimelineRequest {
  string id = 1;
}

message DeleteTimelineResponse {
  bool success = 1;
}

service TimelineService {
  rpc ListTimelines(ListTimelinesRequest) returns (ListTimelinesResponse);
  rpc CreateTimeline(CreateTimelineRequest) returns (Timeline);
  rpc DeleteTimeline(DeleteTimelineRequest) returns (DeleteTimelineResponse);
}
